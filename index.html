<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Snake Game</h1>
    <div class="board">
        <div class="head"></div>
    </div>
    <h3>Choose Difficulty to start</h3>
    <div class="difficulty">
        <button class="btn1" onclick="setSpeed(300)">Easy</button>
        <button class="btn2" onclick="setSpeed(200)">Medium</button>
        <button class="btn3" onclick="setSpeed(100)">Hard</button>
    </div>
    <script src="snake.js"></script>
</body>
</html>
